name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/exposure.test.mjs
      - name: data and headline numbers are reproducible
        run: |
          node scripts/generate.mjs
          node scripts/report.mjs > /dev/null
          git diff --exit-code data/account.json data/results.json
